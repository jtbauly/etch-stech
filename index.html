<!DOCTYPE html>
<html>

<head>

<title>AI Etch A Sketch Robot</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

#machine{
width:850px;
margin:auto;
padding:30px;
background:#d00000;
border-radius:30px;
box-shadow:0 0 40px black;
}

canvas{
background:#eee;
border:15px solid #777;
border-radius:15px;
}

button,input{
padding:10px;
margin:5px;
font-size:16px;
border-radius:10px;
}

button{
cursor:pointer;
}

#robot{
font-size:45px;
position:absolute;
transition:.05s;
}

.knobs{
display:flex;
justify-content:space-between;
}

.knob{
width:70px;
height:70px;
background:#900;
border-radius:50%;
border:8px solid #500;
cursor:pointer;
}

</style>

</head>


<body>


<h1>🤖 AI ETCH A SKETCH ROBOT</h1>


<div id="machine">


<input 
type="file"
id="upload"
accept="image/*"
onchange="autoProcess()">



<br>


<button onclick="drawImage()">✏️ DRAW</button>

<button onclick="pauseDrawing()">⏸ PAUSE</button>

<button onclick="stopDrawing()">⛔ STOP</button>

<button onclick="clearScreen()">🗑 CLEAR</button>

<button onclick="saveImage()">💾 SAVE</button>


<br>


DETAIL

<input
id="detail"
type="range"
min="2"
max="12"
value="5">


SPEED

<input
id="speed"
type="range"
min="1"
max="50"
value="25">


<br><br>


<canvas
id="board"
width="700"
height="450">
</canvas>


<div class="knobs">

<div class="knob" onclick="moveKnob(-5)"></div>

<div class="knob" onclick="moveKnob(5)"></div>

</div>


<div id="robot">🤖</div>


<p id="ai">
⚡ Loading AI...
</p>


</div>





<script>


const canvas=document.getElementById("board");

const ctx=canvas.getContext("2d");


let model=null;

let paths=[];

let strokes=[];

let drawing=false;

let paused=false;

let robotX=350;

let robotY=225;



clearScreen();




// LOAD AI IN BACKGROUND

async function loadAI(){

try{

model=
await mobilenet.load({

version:2,
alpha:.25

});


document.getElementById("ai").innerHTML=
"🤖 AI READY";


}

catch(e){

document.getElementById("ai").innerHTML=
"Drawing mode ready";

}

}


loadAI();





function clearScreen(){

ctx.fillStyle="#eee";

ctx.fillRect(
0,
0,
700,
450
);


paths=[];

strokes=[];

drawing=false;

}




// AUTOMATIC IMAGE PROCESS

async function autoProcess(){


let file=
document.getElementById("upload").files[0];


if(!file)return;



document.getElementById("ai").innerHTML=
"🧠 Processing image...";



let img=new Image();



img.onload=async()=>{



if(model){


let result=
await model.classify(img);


document.getElementById("ai").innerHTML=
"🤖 AI sees: "+
result[0].className;


}



createDrawing(img);



document.getElementById("ai").innerHTML +=
"<br>✅ READY TO DRAW";



};



img.src=
URL.createObjectURL(file);



}






function createDrawing(img){


let temp=
document.createElement("canvas");


temp.width=700;

temp.height=450;



let t=temp.getContext("2d");



t.fillStyle="white";

t.fillRect(
0,
0,
700,
450
);



t.drawImage(
img,
0,
0,
700,
450
);



let data=
t.getImageData(
0,
0,
700,
450
);



strokes=[];


let detail=
Number(
document.getElementById("detail").value
);



for(
let y=2;
y<448;
y+=detail
){


for(
let x=2;
x<698;
x+=detail
){



let i=
(y*700+x)*4;



let a=
(
data.data[i]+
data.data[i+1]+
data.data[i+2]
)/3;



let b=
(
data.data[i+12]+
data.data[i+13]+
data.data[i+14]
)/3;



if(
Math.abs(a-b)>35
){


strokes.push({

x:x,
y:y

});


}


}

}



makePaths();


}







function makePaths(){


paths=[];


let current=[];


for(let p of strokes){



if(current.length===0){

current.push(p);

continue;

}



let last=
current[current.length-1];



let distance=
Math.hypot(
p.x-last.x,
p.y-last.y
);



if(distance<40){

current.push(p);

}

else{


if(current.length>2)
paths.push(current);


current=[p];

}


}



if(current.length>2)
paths.push(current);



}







async function drawImage(){


if(paths.length===0){

alert(
"Upload an image first"
);

return;

}



drawing=true;

paused=false;



ctx.strokeStyle="#111";

ctx.lineWidth=2;



for(let path of paths){



for(let p of path){



while(paused){

await wait(100);

}



if(!drawing)return;



ctx.beginPath();


ctx.moveTo(
robotX,
robotY
);



ctx.lineTo(
p.x,
p.y
);



ctx.stroke();



moveRobot(
p.x,
p.y
);



await wait(
100 -
Number(
document.getElementById("speed").value
)
);



}


}



drawing=false;


}





function pauseDrawing(){

paused=!paused;

}





function stopDrawing(){

drawing=false;

paused=false;

}





function moveRobot(x,y){

robotX=x;

robotY=y;


document.getElementById("robot")
.style.transform=
`
translate(
${x/8}px,
${y/8}px
)
`;

}





function moveKnob(amount){

robotX+=amount;


ctx.beginPath();

ctx.moveTo(
robotX,
robotY
);


ctx.lineTo(
robotX+amount,
robotY
);


ctx.stroke();



moveRobot(
robotX,
robotY
);


}





function saveImage(){

let a=document.createElement("a");


a.download=
"AI-Etch-Sketch.png";


a.href=
canvas.toDataURL();


a.click();


}




function wait(ms){

return new Promise(
r=>setTimeout(r,ms)
);

}


</script>


</body>

</html>
